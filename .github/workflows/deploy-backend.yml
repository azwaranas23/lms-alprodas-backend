name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.ssh"

          printf "%s\n" "${{ secrets.VPS_SSH_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT }}" -H "${{ secrets.VPS_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Deploy to VPS
        shell: bash
        run: |
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o BatchMode=yes \
            -i "$HOME/.ssh/id_ed25519" \
            -p "${{ secrets.VPS_SSH_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
              set -e

              cd ${{ secrets.VPS_PATH }}

              echo "→ Pull latest code"
              git fetch origin
              git reset --hard origin/main

              echo "→ Build Docker image"
              docker compose build --pull --no-cache --progress=plain

              echo "→ Start containers"
              docker compose up -d --remove-orphans

              echo "✅ Backend deployed successfully"
          EOF